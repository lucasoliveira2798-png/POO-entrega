<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parquímetro</title>
    <link rel="stylesheet" href="style_parquimetro.css">
    <script src="script_parquimetro.js" defer></script>
</head>
<body>
        <h1>Parquímetro</h1>
    
        <h2 id="saldo">Saldo: R$ 0.00</h2>
        <p id="mensagem"></p> 

    <div>
        <input type="number" id="valorDeposito" placeholder="Valor a depositar" step="0.01">
        <button onclick="movimentacao.depositar()">Depositar</button>
        <button onclick="document.getElementById('valorDeposito').value = ''">Cancelar</button>
        <button onclick="movimentacao.sacarTroco()">Devolver Troco</button>
    </div>


    <h3>Selecione o tempo de permanência:</h3>
    <div>
        <button onclick="movimentacao.comprarTempo(1, 1.20)">1 Minuto (R$ 1,20)</button>
        <button onclick="movimentacao.comprarTempo(5, 6.00)">5 Minutos (R$ 6,00)</button>
        <button onclick="movimentacao.comprarTempo(15, 18.00)">15 Minutos (R$ 18,00)</button>
        <button onclick="movimentacao.comprarTempo(30, 36.00)">30 Minutos (R$ 36,00)</button>
        <button onclick="movimentacao.comprarTempo(60, 72.00)">60 Minutos (R$ 72,00)</button>
    </div>
    
</body>
</html>
